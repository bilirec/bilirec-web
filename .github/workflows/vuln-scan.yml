name: Vuln scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on critical only)
        run: |
          set +e
          pnpm audit --json > audit.json
          set -e
          node -e "
            const j = JSON.parse(require('fs').readFileSync('audit.json','utf8'));
            const v = j.metadata && j.metadata.vulnerabilities || {};
            const c = v.critical || 0;
            console.log('info=' + (v.info||0), 'low=' + (v.low||0), 'moderate=' + (v.moderate||0), 'high=' + (v.high||0), 'critical=' + c);
            if (c > 0) process.exit(1);
          "
